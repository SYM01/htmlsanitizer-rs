name: Publish npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install wasm-pack
        run: cargo install wasm-pack@0.14.0
      - name: Install binaryen (wasm-opt)
        run: sudo apt-get install -y binaryen
      - name: Build WASM package
        run: wasm-pack build --target bundler --out-dir npm/pkg -- --features wasm
      - name: Optimize WASM binary
        run: wasm-opt -Oz --enable-bulk-memory npm/pkg/htmlsanitizer_bg.wasm -o npm/pkg/htmlsanitizer_bg.wasm
      - name: Remove pkg .gitignore
        run: rm -f npm/pkg/.gitignore
      - name: Build TypeScript
        working-directory: npm
        run: npx tsc
      - name: Publish
        working-directory: npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
