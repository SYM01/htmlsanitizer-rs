[package]
name = "htmlsanitizer"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A fast, allowlist-based HTML sanitizer"
keywords = ["html", "sanitizer", "xss", "security"]
categories = ["web-programming", "text-processing"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
wasm = ["wasm-bindgen", "js-sys"]

[dependencies]
url = "2"
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "sanitize"
harness = false
