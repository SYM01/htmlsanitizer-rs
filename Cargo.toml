[package]
name = "htmlsanitizer"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "A fast, allowlist-based HTML sanitizer"
repository = "https://github.com/SYM01/htmlsanitizer-rs"
keywords = ["html", "sanitizer", "xss", "security"]
categories = ["web-programming", "text-processing"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
wasm = ["wasm-bindgen", "js-sys"]

[dependencies]
url = "2"
wasm-bindgen = { version = "0.2.114", optional = true }
js-sys = { version = "0.3", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "sanitize"
harness = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# wasm-pack's bundled wasm-opt does not support bulk memory operations
# emitted by modern Rust. Rust's own LTO already optimizes the binary well.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
